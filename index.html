<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Registration form</title>
<style>
  body { font-family: sans-serif; max-width: 26rem; margin: 2rem auto; }
  label { display: block; margin-top: 1rem; }
  input { width: 100%; padding: .4rem; box-sizing: border-box; }
  .error { color: #b00020; min-height: 1.2em; font-size: .9em; }
</style>
</head>
<body>
<h1>Register</h1>
<form id="reg" novalidate>
  <label for="email">Email</label>
  <input id="email" name="email" type="text" autocomplete="email">
  <div class="error" data-error-for="email" role="alert"></div>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password">
  <div class="error" data-error-for="password" role="alert"></div>

  <label for="age">Age</label>
  <input id="age" name="age" type="text" inputmode="numeric">
  <div class="error" data-error-for="age" role="alert"></div>

  <button type="submit" style="margin-top:1rem">Register</button>
</form>
<script src="validator.js"></script>
<script>FormValidator.attachToForm(document.getElementById('reg'));</script>
</body>
</html>
